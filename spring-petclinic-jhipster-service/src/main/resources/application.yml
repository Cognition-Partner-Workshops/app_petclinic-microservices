spring:
  application:
    name: jhipster-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888/}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema:
  sql:
    init:
      mode: always

server:
  port: 8085

# JWT Configuration
# The base64-secret MUST be provided via environment variable or config server.
# It must be a base64-encoded key of at least 512 bits (64 bytes) for HS512.
jhipster:
  security:
    authentication:
      jwt:
        base64-secret: ${JHIPSTER_JWT_BASE64_SECRET:}

---
spring:
  config:
    activate:
      on-profile: docker
    import: configserver:http://config-server:8888
