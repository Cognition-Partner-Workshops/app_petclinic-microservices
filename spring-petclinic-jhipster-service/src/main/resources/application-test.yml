spring:
  config:
    import: ""
  datasource:
    url: jdbc:hsqldb:mem:testdb
    driver-class-name: org.hsqldb.jdbc.JDBCDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false

jhipster:
  security:
    authentication:
      jwt:
        # For tests, use a plaintext secret instead of base64 (minimum 64 chars for HS512)
        secret: this-is-a-test-secret-key-that-must-be-at-least-64-characters-long-for-hs512-algorithm
