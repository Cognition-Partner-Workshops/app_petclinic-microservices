worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Map used to support WebSocket upgrades through the proxy.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Common proxy settings shared by every location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    server {
        listen 80;
        server_name _;

        # Liveness endpoint for the reverse proxy itself.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Eureka service-registry dashboard. The dashboard emits a few
        # root-absolute navigation links, so rewrite them to live under
        # /eureka/ when proxied.
        location /eureka/ {
            proxy_set_header X-Forwarded-Prefix /eureka;
            proxy_set_header Accept-Encoding "";
            sub_filter 'href="/"'      'href="/eureka/"';
            sub_filter 'href="/lastn"' 'href="/eureka/lastn"';
            sub_filter_once off;
            proxy_pass http://discovery-server:8761/;
        }

        # Spring Boot Admin dashboard. The SPA hard-codes an absolute
        # <base href> pointing at the internal service URL, so rewrite it
        # to the proxied path so the browser loads assets correctly.
        location /admin/ {
            proxy_set_header X-Forwarded-Prefix /admin;
            proxy_set_header Accept-Encoding "";
            sub_filter 'http://admin-server:9090/' '/admin/';
            sub_filter_once off;
            proxy_pass http://admin-server:9090/;
        }

        # Zipkin distributed-tracing UI (served natively under /zipkin/).
        location /zipkin/ {
            proxy_pass http://tracing-server:9411/zipkin/;
        }

        # Everything else (the AngularJS frontend and all /api/** routes)
        # is handled by the Spring Cloud API Gateway.
        location / {
            proxy_pass http://api-gateway:8080;
        }
    }
}
