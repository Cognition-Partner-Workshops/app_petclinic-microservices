services:
  config-server:
    image: springcommunity/spring-petclinic-config-server
    container_name: it-config-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${PETCLINIC_IT_CONFIG_PORT:-8888}:8888"

  discovery-server:
    image: springcommunity/spring-petclinic-discovery-server
    container_name: it-discovery-server
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${PETCLINIC_IT_DISCOVERY_PORT:-8761}:8761"

  customers-service:
    image: springcommunity/spring-petclinic-customers-service
    container_name: it-customers-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PETCLINIC_IT_CUSTOMERS_PORT:-8081}:8081"

  visits-service:
    image: springcommunity/spring-petclinic-visits-service
    container_name: it-visits-service
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PETCLINIC_IT_VISITS_PORT:-8082}:8082"

  api-gateway:
    image: springcommunity/spring-petclinic-api-gateway
    container_name: it-api-gateway
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${PETCLINIC_IT_GATEWAY_PORT:-8080}:8080"
