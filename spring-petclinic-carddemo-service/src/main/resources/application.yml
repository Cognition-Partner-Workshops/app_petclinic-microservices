spring:
  application:
    name: carddemo-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/carddemo}
    username: ${POSTGRES_USER:}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
